<!DOCTYPE html>
<html>
<head><title>Tree View</title>
<style>
  .tree-node { cursor: pointer; padding: 8px; border: 1px solid #ddd; margin: 2px 0; }
  .tree-node:hover { background: #f0f0f0; }
  .action-btn { cursor: pointer; background: #007bff; color: white; padding: 10px 20px; border-radius: 4px; display: inline-block; }
  .card { cursor: pointer; padding: 16px; border: 1px solid #ccc; margin: 8px 0; }
  .plain-div { padding: 8px; }
</style>
</head>
<body>
  <div class="tree-node" data-id="1">Project Alpha</div>
  <div class="tree-node" data-id="2">Project Beta</div>
  <div class="action-btn" data-action="create">Create New</div>
  <div class="card" data-card="1">Card One</div>
  <div class="plain-div">Not clickable</div>
  <button>Real Button</button>
</body>
</html>
