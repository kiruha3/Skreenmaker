<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkreenMaker TUI</title>
    <link rel="stylesheet" href="/static/app.css">
    <link rel="stylesheet" href="/static/dist/vue-flow.css">
</head>
<body>
<div id="app"></div>
<div id="load-error" style="display:none; padding:20px; font-family:sans-serif; color:#333;">
    <h2>⚠️ Ошибка загрузки интерфейса</h2>
    <p id="err-msg"></p>
    <p style="font-size:12px; color:#666;">Открой DevTools (F12) → Console и скопируй ошибки сюда.</p>
</div>
<script>
    window.onerror = function(msg, url, line) {
        var el = document.getElementById('load-error');
        var msgEl = document.getElementById('err-msg');
        if (el) { el.style.display = 'block'; msgEl.textContent = msg + ' @ ' + url + ':' + line; }
    };
    window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('load-error');
        var msgEl = document.getElementById('err-msg');
        if (el) { el.style.display = 'block'; msgEl.textContent = 'Promise error: ' + e.reason; }
    });
</script>
<script type="module" src="/static/dist/app.mjs"></script>
</body>
</html>
